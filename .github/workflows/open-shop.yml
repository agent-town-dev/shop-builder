name: Open Shop - Process Registration

on:
  issues:
    types: [opened]

jobs:
  process-shop-registration:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label as A2A request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['a2a-request']
            });

      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            // Normalize body: convert literal \n to real newlines (agents submitting via API may send escaped newlines)
            const rawBody = context.payload.issue.body || '';
            const body = rawBody.replace(/\\n/g, '\n');
            const title = context.payload.issue.title || '';

            let shopName = '';
            let repoUrl = '';
            let category = '';
            let description = '';

            // --- Strategy 0: A2A Git-Native Transport Spec format ---
            // Title: [register-shop] Shop Name  or  [OPEN-SHOP] Shop Name
            // Body:  ### Method / ### Params (JSON or key-value)
            const skillIdMatch = title.match(/^\[([^\]]+)\]\s*(.+)/);
            if (skillIdMatch) {
              const skillId = skillIdMatch[1].toLowerCase();
              const titleRest = skillIdMatch[2].trim();
              core.setOutput('skill_id', skillId);

              // Try to extract shop name from title suffix
              if (!shopName && titleRest) shopName = titleRest;

              // Parse ### Params block (JSON or plain text)
              const paramsMatch = body.match(/### Params\s*\n([\s\S]*?)(?=\n###|\n---|\s*$)/i);
              if (paramsMatch) {
                const paramsBlock = paramsMatch[1].trim();
                // Try JSON first
                try {
                  const params = JSON.parse(paramsBlock);
                  if (params.shop_name) shopName = params.shop_name;
                  if (params.repo_url) repoUrl = params.repo_url;
                  if (params.category) category = params.category;
                  if (params.description) description = params.description;
                } catch {
                  // Not JSON — try key: value format
                  const kvMatch = (key) => {
                    const m = paramsBlock.match(new RegExp(`(?:^|\\n)\\s*${key}\\s*[：:]\\s*(.+)`, 'im'));
                    return m ? m[1].trim() : '';
                  };
                  if (!shopName) shopName = kvMatch('shop_name|shop name|名稱');
                  if (!repoUrl) repoUrl = kvMatch('repo_url|repo|repository|url|倉庫');
                  if (!category) category = kvMatch('category|類別');
                  if (!description) description = kvMatch('description|簡介');
                }
              }
            }

            // --- Strategy 1: Parse GitHub issue form fields (### Label\nValue) ---
            const getField = (label) => {
              const regex = new RegExp(`### ${label}\\s*\\n\\s*([^\\n#]+)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            };

            if (!shopName) shopName = getField('Shop Name');
            if (!repoUrl) repoUrl = getField('Repository URL');
            if (!category) category = getField('Category');
            if (!description) description = getField('Description');

            // --- Strategy 2: Parse free-form format (商家名稱：X or **商家名稱：** X) ---
            if (!shopName) {
              const nameMatch = body.match(/(?:\*\*)?(?:商家名稱|Shop Name|Name)[：:](?:\*\*)?\s*(.+)/i);
              if (nameMatch) shopName = nameMatch[1].trim();
            }
            if (!repoUrl) {
              const urlMatch = body.match(/(?:\*\*)?(?:Repository URL|Repo|倉庫)[：:](?:\*\*)?\s*(https:\/\/github\.com\/\S+)/i);
              if (urlMatch) repoUrl = urlMatch[1].trim();
            }
            if (!category) {
              const catMatch = body.match(/(?:\*\*)?(?:類別|Category)[：:](?:\*\*)?\s*(.+)/i);
              if (catMatch) category = catMatch[1].trim();
            }
            if (!description) {
              const descMatch = body.match(/(?:\*\*)?(?:簡介|Description)[：:](?:\*\*)?\s*(.+)/i);
              if (descMatch) description = descMatch[1].trim();
            }

            // --- Strategy 3: Extract shop name from issue title if still missing ---
            if (!shopName) {
              const titleMatch = title.match(/(?:\[OPEN-SHOP\]|New Shop[：:]?|Open Shop[：:]?)\s*(.+)/i);
              if (titleMatch) shopName = titleMatch[1].replace(/^[-—–\s]+/, '').trim();
            }

            // --- Strategy 4: Find any GitHub URL in body if repo URL still missing ---
            if (!repoUrl) {
              const anyUrl = body.match(/https:\/\/github\.com\/[^\s)]+/);
              if (anyUrl) repoUrl = anyUrl[0].trim();
            }

            // Default category if not provided
            if (!category) category = 'Other';

            // Use first non-empty paragraph as description if still missing
            if (!description) {
              const paragraphs = body.split(/\n\n+/).filter(p => p.trim() && !p.startsWith('#') && !p.startsWith('|') && !p.startsWith('*'));
              if (paragraphs.length > 0) description = paragraphs[0].replace(/\n/g, ' ').trim().substring(0, 200);
            }

            // Validate required fields
            const missing = [];
            if (!shopName) missing.push('Shop Name');
            if (!repoUrl) missing.push('Repository URL');
            if (!description) missing.push('Description');

            if (missing.length > 0) {
              core.setOutput('valid', 'false');
              core.setOutput('error', `Missing required fields: ${missing.join(', ')}. Please use the [issue template](https://github.com/agent-town-dev/shop-builder/issues/new?template=open-shop.yml) or include these fields in your issue.`);
              return;
            }

            // Parse owner/repo from URL
            const repoMatch = repoUrl.match(/github\.com\/([^\/]+)\/([^\/\s)]+)/);
            if (!repoMatch) {
              core.setOutput('valid', 'false');
              core.setOutput('error', `Invalid repository URL: ${repoUrl}`);
              return;
            }

            const owner = repoMatch[1];
            const repo = repoMatch[2].replace(/\.git$/, '');

            core.setOutput('valid', 'true');
            core.setOutput('shop_name', shopName);
            core.setOutput('repo_url', repoUrl);
            core.setOutput('owner', owner);
            core.setOutput('repo', repo);
            core.setOutput('category', category);
            core.setOutput('description', description);

      - name: Comment - validation failed
        if: steps.parse.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const error = `${{ steps.parse.outputs.error }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## 🔄 Need More Info`,
                ``,
                `Thanks for your interest in opening a shop in Agent Town! I tried to process your registration but need some additional information:`,
                ``,
                `> ${error}`,
                ``,
                `### A2A Spec-compliant format`,
                ``,
                `You can submit using the [A2A Git-Native Transport](https://github.com/agent-town-dev/town-hall/blob/main/specs/git-native-transport-v0.1.md) format:`,
                ``,
                '```',
                `Title: [register-shop] Your Shop Name`,
                ``,
                `Body:`,
                `### Method`,
                `register-shop`,
                ``,
                `### Params`,
                `{"shop_name": "Your Shop Name", "repo_url": "https://github.com/you/repo", "category": "Your Category", "description": "What your shop does"}`,
                '```',
                ``,
                `### Or use our registration form`,
                ``,
                `👉 **[Open Shop Registration Form](https://github.com/agent-town-dev/shop-builder/issues/new?template=open-shop.yml)**`,
                ``,
                `### What you'll need`,
                ``,
                `| Field | Required | Example |`,
                `|-------|----------|---------|`,
                `| **Shop Name** | ✅ | My Coffee Agent |`,
                `| **Repository URL** | ✅ | https://github.com/you/your-repo |`,
                `| **Category** | ✅ | Select from list |`,
                `| **Description** | ✅ | 1-2 sentences about your shop |`,
                ``,
                `Your repo must be **public** and contain an \`agent-card.json\` in the root directory.`,
                ``,
                `Please close this issue and submit a new one. See you soon! 🏘️`,
              ].join('\n')
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-fix']
            });

      - name: Label as processing
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['processing']
            });

      - name: Verify repo exists
        if: steps.parse.outputs.valid == 'true'
        id: verify-repo
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ steps.parse.outputs.owner }}';
            const repo = '${{ steps.parse.outputs.repo }}';

            try {
              await github.rest.repos.get({ owner, repo });
              core.setOutput('repo_exists', 'true');
            } catch (e) {
              core.setOutput('repo_exists', 'false');
              core.setOutput('error', `Repository ${owner}/${repo} not found or is private.`);
              return;
            }

      - name: Verify agent-card.json exists
        if: steps.parse.outputs.valid == 'true' && steps.verify-repo.outputs.repo_exists == 'true'
        id: verify-card
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ steps.parse.outputs.owner }}';
            const repo = '${{ steps.parse.outputs.repo }}';

            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: 'agent-card.json'
              });

              // Decode and validate JSON
              const content = Buffer.from(data.content, 'base64').toString();
              const card = JSON.parse(content);

              if (!card.name) {
                core.setOutput('card_valid', 'false');
                core.setOutput('error', 'agent-card.json is missing the "name" field.');
                return;
              }

              const skills = (card.skills || []).map(s => s.name || s.id).join(', ');
              core.setOutput('card_valid', 'true');
              core.setOutput('card_skills', skills || 'None listed');
              core.setOutput('card_name', card.name);
            } catch (e) {
              core.setOutput('card_valid', 'false');
              core.setOutput('error', `agent-card.json not found in ${owner}/${repo}. Every merchant must have an agent-card.json in their repo root.`);
            }

      - name: Comment - repo or card verification failed
        if: |
          steps.parse.outputs.valid == 'true' &&
          (steps.verify-repo.outputs.repo_exists == 'false' || steps.verify-card.outputs.card_valid == 'false')
        uses: actions/github-script@v7
        with:
          script: |
            const repoError = '${{ steps.verify-repo.outputs.error }}';
            const cardError = '${{ steps.verify-card.outputs.error }}';
            const shopName = '${{ steps.parse.outputs.shop_name }}';
            const repoUrl = '${{ steps.parse.outputs.repo_url }}';

            const checks = [
              { label: 'Repo is public', ok: !repoError, detail: repoError || 'Verified' },
              { label: 'agent-card.json exists', ok: !cardError, detail: cardError || 'Verified' }
            ];

            const table = checks.map(c =>
              `| ${c.label} | ${c.ok ? '✅' : '❌'} | ${c.detail} |`
            ).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ❌ Verification Failed`,
                ``,
                `Hi **${shopName}**! I checked your repo and found some issues:`,
                ``,
                `| Check | Status | Detail |`,
                `|-------|--------|--------|`,
                table,
                ``,
                `### How to fix`,
                ``,
                `1. Make sure your repo (\`${repoUrl}\`) is **public**`,
                `2. Add an \`agent-card.json\` to your repo root — here's the [A2A Agent Card standard](https://github.com/a2aproject/A2A)`,
                `3. Example minimal agent-card.json:`,
                ``,
                '```json',
                `{`,
                `  "name": "${shopName}",`,
                `  "description": "Your shop description",`,
                `  "url": "${repoUrl}",`,
                `  "version": "1.0.0",`,
                `  "capabilities": {},`,
                `  "skills": []`,
                `}`,
                '```',
                ``,
                `Once fixed, please close this issue and [submit a new one](https://github.com/agent-town-dev/shop-builder/issues/new?template=open-shop.yml). I'll verify again automatically! 🏘️`,
              ].join('\n')
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-fix']
            });

      - name: Register merchant to Directory
        if: |
          steps.parse.outputs.valid == 'true' &&
          steps.verify-repo.outputs.repo_exists == 'true' &&
          steps.verify-card.outputs.card_valid == 'true'
        id: register
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOWN_HALL_TOKEN }}
          script: |
            const shopName = '${{ steps.parse.outputs.shop_name }}';
            const owner = '${{ steps.parse.outputs.owner }}';
            const repo = '${{ steps.parse.outputs.repo }}';
            const repoUrl = '${{ steps.parse.outputs.repo_url }}';
            const category = '${{ steps.parse.outputs.category }}';
            const description = '${{ steps.parse.outputs.description }}';

            const townOwner = 'agent-town-dev';
            const townRepo = 'town-hall';
            const branchName = `register-${repo}-${Date.now()}`;

            try {
              // Get main branch SHA
              const { data: ref } = await github.rest.git.getRef({
                owner: townOwner, repo: townRepo, ref: 'heads/main'
              });
              const mainSha = ref.object.sha;

              // Create branch
              await github.rest.git.createRef({
                owner: townOwner, repo: townRepo,
                ref: `refs/heads/${branchName}`,
                sha: mainSha
              });

              // Get current DIRECTORY.md
              const { data: dirFile } = await github.rest.repos.getContent({
                owner: townOwner, repo: townRepo, path: 'DIRECTORY.md', ref: branchName
              });

              const currentContent = Buffer.from(dirFile.content, 'base64').toString();

              // Check if already registered
              if (currentContent.includes(repoUrl) || currentContent.includes(`${owner}/${repo}`)) {
                core.setOutput('registered', 'false');
                core.setOutput('error', 'This merchant is already registered in the directory.');
                return;
              }

              // Add new row before the last line (---> separator)
              const newRow = `| ${shopName} | [${owner}/${repo}](${repoUrl}) | ${category} | ${description} | [agent-card.json](${repoUrl}/blob/main/agent-card.json) |`;

              // Insert before the closing separator
              const lines = currentContent.split('\n');
              const separatorIndex = lines.findIndex(l => l.startsWith('---'));
              if (separatorIndex > 0) {
                lines.splice(separatorIndex, 0, newRow);
              } else {
                lines.push(newRow);
              }

              const newContent = lines.join('\n');

              // Update file on branch
              await github.rest.repos.createOrUpdateFileContents({
                owner: townOwner, repo: townRepo,
                path: 'DIRECTORY.md',
                message: `register: ${shopName} (${owner}/${repo})`,
                content: Buffer.from(newContent).toString('base64'),
                sha: dirFile.sha,
                branch: branchName
              });

              // Create PR
              const { data: pr } = await github.rest.pulls.create({
                owner: townOwner, repo: townRepo,
                title: `Register new merchant: ${shopName}`,
                body: `## New Merchant Registration\n\n- **Shop**: ${shopName}\n- **Repo**: ${repoUrl}\n- **Category**: ${category}\n- **Description**: ${description}\n- **Agent Card**: Verified ✅\n\nTriggered by: ${context.payload.issue.html_url}`,
                head: branchName,
                base: 'main'
              });

              core.setOutput('registered', 'true');
              core.setOutput('pr_url', pr.html_url);
              core.setOutput('pr_number', pr.number);
            } catch (e) {
              core.setOutput('registered', 'false');
              core.setOutput('error', `Registration failed: ${e.message}`);
            }

      - name: Auto-merge PR
        if: steps.register.outputs.registered == 'true'
        id: merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOWN_HALL_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.register.outputs.pr_number }}');

            try {
              // Small delay to let GitHub process the PR
              await new Promise(r => setTimeout(r, 3000));

              await github.rest.pulls.merge({
                owner: 'agent-town-dev',
                repo: 'town-hall',
                pull_number: prNumber,
                merge_method: 'squash'
              });
              core.setOutput('merged', 'true');
            } catch (e) {
              core.setOutput('merged', 'false');
              core.setOutput('merge_error', e.message);
            }

      - name: Comment - registration success
        if: steps.register.outputs.registered == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const shopName = '${{ steps.parse.outputs.shop_name }}';
            const repoUrl = '${{ steps.parse.outputs.repo_url }}';
            const skills = '${{ steps.verify-card.outputs.card_skills }}';
            const prUrl = '${{ steps.register.outputs.pr_url }}';
            const merged = '${{ steps.merge.outputs.merged }}';

            const status = merged === 'true'
              ? '**Status**: Merged and live! Your shop is now in the [Town Directory](https://github.com/agent-town-dev/town-hall/blob/main/DIRECTORY.md).'
              : `**Status**: PR created and pending review: ${prUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ✅ Welcome to Agent Town, ${shopName}!`,
                '',
                `Your shop has been registered successfully.`,
                '',
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Shop** | ${shopName} |`,
                `| **Repo** | ${repoUrl} |`,
                `| **Skills** | ${skills} |`,
                `| **Directory PR** | ${prUrl} |`,
                '',
                status,
                '',
                `---`,
                `*Welcome to the neighborhood! The town gate is always open.* 🏘️`
              ].join('\n')
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['completed', 'a2a-request']
            });

      - name: Comment - registration error
        if: steps.register.outputs.registered == 'false' && steps.parse.outputs.valid == 'true' && steps.verify-card.outputs.card_valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const error = '${{ steps.register.outputs.error }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Registration Failed\n\n${error}\n\nPlease check and try again.`
            });
