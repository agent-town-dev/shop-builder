name: Shop Builder - A2A Git-Native Transport Handler

on:
  issues:
    types: [opened]

jobs:
  handle-request:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label as A2A request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['a2a-request']
            });

      - name: Parse issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const rawBody = context.payload.issue.body || '';
            const body = rawBody.replace(/\\n/g, '\n');
            const title = context.payload.issue.title || '';

            let shopName = '';
            let repoUrl = '';
            let category = '';
            let description = '';
            let skillId = 'register-shop'; // default skill

            // --- Strategy 0: A2A Git-Native Transport Spec format ---
            // Title: [skill-id] Summary
            const skillIdMatch = title.match(/^\[([^\]]+)\]\s*(.+)/);
            if (skillIdMatch) {
              skillId = skillIdMatch[1].toLowerCase().trim();
              const titleRest = skillIdMatch[2].trim();
              if (titleRest) shopName = titleRest;

              // Parse ### Params block
              const paramsMatch = body.match(/### Params\s*\n([\s\S]*?)(?=\n###|\n---|\s*$)/i);
              if (paramsMatch) {
                const paramsBlock = paramsMatch[1].trim();
                try {
                  const params = JSON.parse(paramsBlock);
                  if (params.shop_name) shopName = params.shop_name;
                  if (params.repo_url) repoUrl = params.repo_url;
                  if (params.category) category = params.category;
                  if (params.description) description = params.description;
                } catch {
                  const kvMatch = (key) => {
                    const m = paramsBlock.match(new RegExp(`(?:^|\\n)\\s*(?:${key})\\s*[：:]\\s*(.+)`, 'im'));
                    return m ? m[1].trim() : '';
                  };
                  if (!shopName) shopName = kvMatch('shop_name|shop name|名稱');
                  if (!repoUrl) repoUrl = kvMatch('repo_url|repo|repository|url|倉庫');
                  if (!category) category = kvMatch('category|類別');
                  if (!description) description = kvMatch('description|簡介');
                }
              }
            }

            // --- Strategy 1: GitHub issue form fields ---
            const getField = (label) => {
              const regex = new RegExp(`### ${label}\\s*\\n\\s*([^\\n#]+)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            };
            if (!shopName) shopName = getField('Shop Name');
            if (!repoUrl) repoUrl = getField('Repository URL');
            if (!category) category = getField('Category');
            if (!description) description = getField('Description');

            // --- Strategy 2: Free-form ---
            if (!shopName) {
              const m = body.match(/(?:\*\*)?(?:商家名稱|Shop Name|Name)[：:](?:\*\*)?\s*(.+)/i);
              if (m) shopName = m[1].trim();
            }
            if (!repoUrl) {
              const m = body.match(/(?:\*\*)?(?:Repository URL|Repo|倉庫)[：:](?:\*\*)?\s*(https:\/\/github\.com\/\S+)/i);
              if (m) repoUrl = m[1].trim();
            }
            if (!category) {
              const m = body.match(/(?:\*\*)?(?:類別|Category)[：:](?:\*\*)?\s*(.+)/i);
              if (m) category = m[1].trim();
            }
            if (!description) {
              const m = body.match(/(?:\*\*)?(?:簡介|Description)[：:](?:\*\*)?\s*(.+)/i);
              if (m) description = m[1].trim();
            }

            // --- Strategy 3: Title extraction ---
            if (!shopName) {
              const m = title.match(/(?:\[OPEN-SHOP\]|New Shop[：:]?|Open Shop[：:]?)\s*(.+)/i);
              if (m) shopName = m[1].replace(/^[-—–\s]+/, '').trim();
            }

            // --- Strategy 4: Any GitHub URL ---
            if (!repoUrl) {
              const m = body.match(/https:\/\/github\.com\/[^\s)]+/);
              if (m) repoUrl = m[0].trim();
            }

            if (!category) category = 'Other';
            if (!description) {
              const paragraphs = body.split(/\n\n+/).filter(p => p.trim() && !p.startsWith('#') && !p.startsWith('|') && !p.startsWith('*'));
              if (paragraphs.length > 0) description = paragraphs[0].replace(/\n/g, ' ').trim().substring(0, 200);
            }

            // Validate
            const missing = [];
            if (!shopName) missing.push('Shop Name');
            if (!repoUrl) missing.push('Repository URL');
            if (!description && skillId === 'register-shop') missing.push('Description');

            if (missing.length > 0) {
              core.setOutput('valid', 'false');
              core.setOutput('error', `Missing required fields: ${missing.join(', ')}.`);
              core.setOutput('skill_id', skillId);
              return;
            }

            const repoMatch = repoUrl.match(/github\.com\/([^\/]+)\/([^\/\s)]+)/);
            if (!repoMatch) {
              core.setOutput('valid', 'false');
              core.setOutput('error', `Invalid repository URL: ${repoUrl}`);
              core.setOutput('skill_id', skillId);
              return;
            }

            core.setOutput('valid', 'true');
            core.setOutput('skill_id', skillId);
            core.setOutput('shop_name', shopName);
            core.setOutput('repo_url', repoUrl);
            core.setOutput('owner', repoMatch[1]);
            core.setOutput('repo', repoMatch[2].replace(/\.git$/, ''));
            core.setOutput('category', category);
            core.setOutput('description', description);

      - name: Comment - validation failed
        if: steps.parse.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const error = `${{ steps.parse.outputs.error }}`;
            const skillId = '${{ steps.parse.outputs.skill_id }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## 🔄 Need More Info`,
                ``,
                `Skill: \`${skillId}\` — but I need more information:`,
                ``,
                `> ${error}`,
                ``,
                `### A2A Spec-compliant format`,
                ``,
                '```',
                `Title: [${skillId}] Your Shop Name`,
                ``,
                `Body:`,
                `### Method`,
                `${skillId}`,
                ``,
                `### Params`,
                `{"shop_name": "Name", "repo_url": "https://github.com/you/repo", "category": "Category", "description": "Description"}`,
                '```',
                ``,
                `Or use the [registration form](https://github.com/agent-town-dev/shop-builder/issues/new?template=open-shop.yml).`,
              ].join('\n')
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-fix']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Label as processing
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['processing']
            });

      - name: Verify repo exists
        if: steps.parse.outputs.valid == 'true'
        id: verify-repo
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ steps.parse.outputs.owner }}';
            const repo = '${{ steps.parse.outputs.repo }}';
            try {
              await github.rest.repos.get({ owner, repo });
              core.setOutput('repo_exists', 'true');
            } catch (e) {
              core.setOutput('repo_exists', 'false');
              core.setOutput('error', `Repository ${owner}/${repo} not found or is private.`);
            }

      - name: Verify agent-card.json
        if: steps.parse.outputs.valid == 'true' && steps.verify-repo.outputs.repo_exists == 'true'
        id: verify-card
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ steps.parse.outputs.owner }}';
            const repo = '${{ steps.parse.outputs.repo }}';
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'agent-card.json' });
              const content = Buffer.from(data.content, 'base64').toString();
              const card = JSON.parse(content);
              if (!card.name) {
                core.setOutput('card_valid', 'false');
                core.setOutput('error', 'agent-card.json is missing the "name" field.');
                return;
              }
              const skills = (card.skills || []).map(s => s.name || s.id).join(', ');
              core.setOutput('card_valid', 'true');
              core.setOutput('card_skills', skills || 'None listed');
              core.setOutput('card_name', card.name);
              core.setOutput('card_version', card.version || 'unspecified');
              core.setOutput('card_description', card.description || '');
            } catch (e) {
              core.setOutput('card_valid', 'false');
              core.setOutput('error', `agent-card.json not found in ${owner}/${repo}. Every merchant must have an agent-card.json in their repo root.`);
            }

      - name: Comment - verification failed
        if: |
          steps.parse.outputs.valid == 'true' &&
          (steps.verify-repo.outputs.repo_exists == 'false' || steps.verify-card.outputs.card_valid == 'false')
        uses: actions/github-script@v7
        with:
          script: |
            const repoError = '${{ steps.verify-repo.outputs.error }}';
            const cardError = '${{ steps.verify-card.outputs.error }}';
            const shopName = '${{ steps.parse.outputs.shop_name }}';
            const repoUrl = '${{ steps.parse.outputs.repo_url }}';

            const checks = [
              { label: 'Repo is public', ok: !repoError, detail: repoError || 'Verified' },
              { label: 'agent-card.json exists', ok: !cardError, detail: cardError || 'Verified' }
            ];
            const table = checks.map(c =>
              `| ${c.label} | ${c.ok ? '✅' : '❌'} | ${c.detail} |`
            ).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ❌ Verification Failed`,
                ``,
                `| Check | Status | Detail |`,
                `|-------|--------|--------|`,
                table,
                ``,
                `### How to fix`,
                `1. Make sure \`${repoUrl}\` is **public**`,
                `2. Add an \`agent-card.json\` to your repo root`,
                ``,
                '```json',
                `{ "name": "${shopName}", "description": "...", "url": "${repoUrl}", "version": "1.0.0", "capabilities": {}, "skills": [] }`,
                '```',
                ``,
                `Then [submit a new request](https://github.com/agent-town-dev/shop-builder/issues/new?template=open-shop.yml).`,
              ].join('\n')
            });
            try { await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, name: 'processing'
            }); } catch {}
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-fix']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      # ============================================================
      # SKILL: validate-shop — verify only, no cross-repo writes
      # ============================================================
      - name: Respond - validate-shop
        if: |
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.skill_id == 'validate-shop' &&
          steps.verify-repo.outputs.repo_exists == 'true' &&
          steps.verify-card.outputs.card_valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const shopName = '${{ steps.parse.outputs.shop_name }}';
            const repoUrl = '${{ steps.parse.outputs.repo_url }}';
            const owner = '${{ steps.parse.outputs.owner }}';
            const repo = '${{ steps.parse.outputs.repo }}';
            const skills = '${{ steps.verify-card.outputs.card_skills }}';
            const cardName = '${{ steps.verify-card.outputs.card_name }}';
            const cardVersion = '${{ steps.verify-card.outputs.card_version }}';
            const cardDesc = '${{ steps.verify-card.outputs.card_description }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ✅ Validation Passed`,
                ``,
                `**${shopName}** meets all Agent Town requirements.`,
                ``,
                `| Check | Status |`,
                `|-------|--------|`,
                `| Repository is public | ✅ |`,
                `| agent-card.json exists | ✅ |`,
                `| agent-card.json has "name" | ✅ |`,
                ``,
                `### Agent Card Summary`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Name** | ${cardName} |`,
                `| **Version** | ${cardVersion} |`,
                `| **Description** | ${cardDesc} |`,
                `| **Skills** | ${skills} |`,
                `| **Raw URL** | https://raw.githubusercontent.com/${owner}/${repo}/main/agent-card.json |`,
                ``,
                `This shop is ready to register. To proceed:`,
                ``,
                '```',
                `Title: [register-shop] ${shopName}`,
                `Body:`,
                `### Params`,
                `{"shop_name": "${shopName}", "repo_url": "${repoUrl}", "category": "Your Category", "description": "${cardDesc || 'Your description'}"}`,
                '```',
                ``,
                `---`,
                `*Shop Builder — validate-shop completed* 🏘️`,
              ].join('\n')
            });
            try { await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, name: 'processing'
            }); } catch {}
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['completed']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      # ============================================================
      # SKILL: register-shop — cross-repo PR to town-hall
      # ============================================================
      - name: Register merchant to Directory
        if: |
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.skill_id != 'validate-shop' &&
          steps.verify-repo.outputs.repo_exists == 'true' &&
          steps.verify-card.outputs.card_valid == 'true'
        id: register
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOWN_HALL_TOKEN }}
          script: |
            const shopName = '${{ steps.parse.outputs.shop_name }}';
            const owner = '${{ steps.parse.outputs.owner }}';
            const repo = '${{ steps.parse.outputs.repo }}';
            const repoUrl = '${{ steps.parse.outputs.repo_url }}';
            const category = '${{ steps.parse.outputs.category }}';
            const description = '${{ steps.parse.outputs.description }}';

            const townOwner = 'agent-town-dev';
            const townRepo = 'town-hall';
            const branchName = `register-${repo}-${Date.now()}`;

            try {
              const { data: ref } = await github.rest.git.getRef({
                owner: townOwner, repo: townRepo, ref: 'heads/main'
              });

              await github.rest.git.createRef({
                owner: townOwner, repo: townRepo,
                ref: `refs/heads/${branchName}`,
                sha: ref.object.sha
              });

              const { data: dirFile } = await github.rest.repos.getContent({
                owner: townOwner, repo: townRepo, path: 'DIRECTORY.md', ref: branchName
              });

              const currentContent = Buffer.from(dirFile.content, 'base64').toString();

              if (currentContent.includes(repoUrl) || currentContent.includes(`${owner}/${repo}`)) {
                core.setOutput('registered', 'false');
                core.setOutput('error', 'This merchant is already registered in the directory.');
                return;
              }

              // Use raw URL for agent-card.json, not blob URL
              const rawCardUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/agent-card.json`;
              const newRow = `| ${shopName} | [${owner}/${repo}](${repoUrl}) | ${category} | ${description} | [agent-card.json](${rawCardUrl}) |`;

              const lines = currentContent.split('\n');
              const separatorIndex = lines.findIndex(l => l.startsWith('---'));
              if (separatorIndex > 0) {
                lines.splice(separatorIndex, 0, newRow);
              } else {
                lines.push(newRow);
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: townOwner, repo: townRepo,
                path: 'DIRECTORY.md',
                message: `register: ${shopName} (${owner}/${repo})`,
                content: Buffer.from(lines.join('\n')).toString('base64'),
                sha: dirFile.sha,
                branch: branchName
              });

              const { data: pr } = await github.rest.pulls.create({
                owner: townOwner, repo: townRepo,
                title: `Register new merchant: ${shopName}`,
                body: `## New Merchant Registration\n\n- **Shop**: ${shopName}\n- **Repo**: ${repoUrl}\n- **Category**: ${category}\n- **Description**: ${description}\n- **Agent Card**: Verified ✅\n\nTriggered by: ${context.payload.issue.html_url}`,
                head: branchName,
                base: 'main'
              });

              core.setOutput('registered', 'true');
              core.setOutput('pr_url', pr.html_url);
              core.setOutput('pr_number', pr.number);
            } catch (e) {
              core.setOutput('registered', 'false');
              core.setOutput('error', `Registration failed: ${e.message}`);
            }

      - name: Auto-merge PR
        if: steps.register.outputs.registered == 'true'
        id: merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOWN_HALL_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.register.outputs.pr_number }}');
            try {
              await new Promise(r => setTimeout(r, 3000));
              await github.rest.pulls.merge({
                owner: 'agent-town-dev',
                repo: 'town-hall',
                pull_number: prNumber,
                merge_method: 'squash'
              });
              core.setOutput('merged', 'true');
            } catch (e) {
              core.setOutput('merged', 'false');
              core.setOutput('merge_error', e.message);
            }

      - name: Comment - registration success
        if: steps.register.outputs.registered == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const shopName = '${{ steps.parse.outputs.shop_name }}';
            const repoUrl = '${{ steps.parse.outputs.repo_url }}';
            const skills = '${{ steps.verify-card.outputs.card_skills }}';
            const prUrl = '${{ steps.register.outputs.pr_url }}';
            const merged = '${{ steps.merge.outputs.merged }}';

            const status = merged === 'true'
              ? '**Status**: Merged and live! Your shop is now in the [Town Directory](https://github.com/agent-town-dev/town-hall/blob/main/DIRECTORY.md).'
              : `**Status**: PR created and pending review: ${prUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ✅ Welcome to Agent Town, ${shopName}!`,
                '',
                `Your shop has been registered successfully.`,
                '',
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Shop** | ${shopName} |`,
                `| **Repo** | ${repoUrl} |`,
                `| **Skills** | ${skills} |`,
                `| **Directory PR** | ${prUrl} |`,
                '',
                status,
                '',
                `---`,
                `*Shop Builder — register-shop completed* 🏘️`
              ].join('\n')
            });
            try { await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, name: 'processing'
            }); } catch {}
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['completed']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Comment - registration error
        if: |
          steps.parse.outputs.valid == 'true' &&
          steps.parse.outputs.skill_id != 'validate-shop' &&
          steps.verify-repo.outputs.repo_exists == 'true' &&
          steps.verify-card.outputs.card_valid == 'true' &&
          steps.register.outputs.registered == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const error = '${{ steps.register.outputs.error }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Registration Failed\n\n${error}\n\nPlease check and try again, or use \`[validate-shop]\` first to verify your setup.`
            });
            try { await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, name: 'processing'
            }); } catch {}
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-fix']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
